services:
  db:
    image: postgres:16-alpine
    container_name: weathertrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: weathertrack
      POSTGRES_PASSWORD: weathertrack_dev_password
      POSTGRES_DB: weathertrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U weathertrack -d weathertrack" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
